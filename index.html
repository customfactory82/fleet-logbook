<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Hire Fleet Logbook</title>
<meta name="description" content="Car hire fleet logbook by Custom Factory. Records are saved on this phone.">
<meta name="theme-color" content="#2B3036">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fleet Logbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";src:url(fonts/barlow-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-600.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-800.woff2) format("woff2");font-weight:800 900;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-700.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-800.woff2) format("woff2");font-weight:800 900;font-display:swap}
:root{
  /* Custom Factory brand from the printed logbook: steel grey + hi-vis yellow */
  --steel:#2B3036; --steel-2:#3E464F; --mid:#5D6670; --line:#D3D8DD; --paper:#F2F3F5; --card:#FFFFFF; --tint:#E8EBEE;
  --yel:#FFD400; --yel-soft:#FFF6C2;
  --over:#C62828; --over-soft:#FDECEC; --soon:#8A5200; --soon-soft:#FFF0D1; --ok:#2E7D32; --ok-soft:#E6F3E7;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* layout: hazard-stripe header, one app column (max 760px), one card per record, bottom tab bar for one-handed use */
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--steel);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1A73E8;outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding-bottom:96px}
.stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--yel) 0 10px,var(--steel) 10px 20px)}
header.top{background:var(--steel);color:#fff;padding:12px 16px 16px}
.topline{display:flex;align-items:center;gap:10px;min-height:30px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:1.5px solid #6E7782;color:#fff;border-radius:6px;min-height:32px;padding:0 10px 0 6px;font-weight:700;font-size:14px;cursor:pointer}
.back svg{width:18px;height:18px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);background:var(--yel);padding:2px 7px;white-space:nowrap}
.co{margin-left:auto;font-size:14px;font-weight:600;color:#C9CFD5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;margin:10px 0 4px;text-wrap:balance}
.sub{color:#C9CFD5;font-size:15px;text-wrap:pretty}
main{padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0;display:flex;align-items:center;gap:8px}
h2::before{content:"";flex:none;width:10px;height:10px;background:var(--yel);border:2px solid var(--steel)}
h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--mid)}
.card>h2,.lsec>h2{margin-bottom:10px}
p{margin:0}
.muted{color:var(--mid)}
.na{color:#9AA2AA}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:2px solid var(--steel);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--yel)}
.btn.dark{background:var(--steel);color:#fff}
.btn.danger{border-color:var(--over);color:var(--over);background:#fff}
.btn.danger.armed{background:var(--over);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.banner{background:var(--yel-soft);border-left:6px solid var(--yel);padding:10px 12px;border-radius:6px;font-size:15px}
.banner.warn{background:var(--soon-soft);border-left-color:var(--soon)}
.tip{background:var(--yel-soft);border-left:6px solid var(--yel);padding:10px 12px;border-radius:6px;font-size:15px}
.tip b{font-weight:800;letter-spacing:.08em;margin-right:6px}
/* cover panel */
.cover{background:#fff;border-radius:10px;border:1px solid var(--line);border-top:6px solid var(--yel);padding:14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.cv-name{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:2px 0 4px;overflow-wrap:anywhere}
.cv-meta{font-size:14px;color:var(--mid)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-bottom:4px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left}
.tile b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600;color:var(--mid);line-height:1.2}
.tile.info{border-bottom-color:var(--steel)}
.tile.soon{border-bottom-color:var(--soon)}
.tile.soon b{color:var(--soon)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;cursor:pointer;text-align:left}
.row:hover{border-color:#B8BFC6}
.row.sel{outline:2.5px solid var(--steel);outline-offset:1px}
.row.over{border-left-color:var(--over)} .row.soon{border-left-color:var(--soon)} .row.ok{border-left-color:var(--ok)} .row.info{border-left-color:var(--steel)}
.r-top{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mid);font-variant-numeric:tabular-nums}
.r-main{grid-column:1;font-weight:700;overflow-wrap:anywhere}
.r-meta,.r-extra,.r-foot{grid-column:1;font-size:14px;color:var(--mid);overflow-wrap:anywhere}
.r-amt{grid-column:2;grid-row:2/span 3;align-self:center;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-act{grid-column:1/-1;margin-top:6px}
.reg{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.3;background:var(--yel);color:var(--steel);padding:0 6px;border:1.5px solid var(--steel);border-radius:3px;letter-spacing:.05em;white-space:nowrap}
.no{font-weight:800;color:var(--steel)}
.pill{font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill.over{background:var(--over-soft);color:var(--over)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--steel);color:var(--yel)}
.pill.mute{background:var(--tint);color:var(--mid)}
.empty{background:#fff;border:1.5px dashed #B8BFC6;border-radius:8px;padding:16px;color:var(--mid);text-align:center}
.sumbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-variant-numeric:tabular-nums}
.lsec{display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mid)}
.fbar select{width:auto;min-width:180px;flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid #AEB5BD;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff}
/* sections grid */
.inside{display:flex;flex-direction:column;gap:14px}
.grp-h{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.sec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.sn{font-family:var(--display);font-weight:800;font-size:20px;color:var(--mid);width:28px;font-variant-numeric:tabular-nums}
.st b{display:block;font-weight:700}
.st small{display:block;color:var(--mid);font-size:13px}
.sc{font-size:12px;font-weight:800;background:var(--tint);border-radius:99px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc.soon{background:var(--soon-soft);color:var(--soon)}
.sc:empty{display:none}
/* definition grids */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.dl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ch h2{margin:0}
.ren-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ren-h .mm{color:var(--mid);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:0}
.ri{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:6px 10px}
.ri.over{border-left-color:var(--over);background:var(--over-soft)}
.ri.soon{border-left-color:var(--soon);background:var(--soon-soft)}
.ri.ok{border-left-color:var(--ok)}
.ri dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.ri dd{margin:2px 0 0;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* vehicle summary */
.vsum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.vsum .big{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;position:sticky;top:0;background:var(--paper);z-index:5}
.tabs2 button{flex:none;min-height:40px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:var(--mid);cursor:pointer}
.tabs2 button[aria-selected="true"]{color:var(--steel);border-bottom-color:var(--yel)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.grid{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.grid th{background:var(--steel);color:#fff;font-size:12px;font-weight:700;text-align:right;padding:8px;white-space:nowrap;vertical-align:bottom}
table.grid td{border-top:1px solid var(--line);padding:7px 8px;white-space:nowrap;text-align:right;background:#fff}
table.grid th:first-child,table.grid td:first-child{text-align:left;position:sticky;left:0;z-index:1}
table.grid th:first-child{background:var(--steel)}
table.grid tr.tot td{background:var(--yel-soft);border-top:2px solid var(--steel);font-weight:800}
table.grid tr.grp td{background:var(--yel);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:left}
table.grid td.it{white-space:normal;min-width:170px;font-size:14px}
table.grid td.c{text-align:center;font-weight:800;font-size:16px}
td.ok{color:var(--ok)} td.fix{color:var(--over);background:var(--over-soft)!important}
table.grid th .thb{background:none;border:0;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
table.grid input{width:84px;min-height:38px;text-align:right;padding:6px 8px}
/* steps */
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;position:relative;padding-left:40px;line-height:1.45}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;background:var(--steel);color:var(--yel);font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:4px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
/* glovebox card */
.ecard{background:#fff;border:2px dashed var(--mid);border-radius:10px;padding:14px;max-width:420px}
.et{background:var(--steel);color:var(--yel);font-weight:800;font-size:14px;letter-spacing:.1em;padding:8px 10px;margin-bottom:10px}
.kv{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0}
.kv span{width:130px;flex:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.kv b{overflow-wrap:anywhere}
.ecard ol{margin:10px 0 0;padding-left:20px;font-weight:600;line-height:1.5}
/* footer */
.foot{font-size:13px;color:var(--mid);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.foot b{color:var(--steel)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--steel);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
nav.tabs button{background:none;border:0;border-top:3px solid transparent;color:#C9CFD5;padding:7px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;cursor:pointer}
nav.tabs button[aria-current="page"]{color:#fff;border-top-color:var(--yel)}
nav.tabs svg{width:24px;height:24px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(20,23,26,.6)}
.sheet.open{display:flex;justify-content:center;align-items:stretch}
.sh{background:var(--paper);width:100%;max-width:720px;height:100%;display:flex;flex-direction:column}
@media (min-width:760px){.sheet.open{align-items:center}.sh{height:auto;max-height:94%;border-radius:12px;overflow:hidden}}
.sh-head{background:var(--steel);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;flex:none}
.sh-head h2{color:#fff;font-size:15px;flex:1}
.sh-x{background:none;border:1.5px solid #6E7782;color:#fff;border-radius:6px;min-height:36px;min-width:36px;cursor:pointer;font-size:20px;line-height:1}
.sh-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sh-foot{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.sh-btns{display:flex;gap:10px;align-items:center}
.sh-btns .sp{flex:1}
.sh-msg{font-size:14px;font-weight:600;color:var(--over)}
.sh-msg:empty{display:none}
.sh-msg.okm{color:var(--ok)}
/* forms */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label,.fld .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid)}
.rq{color:var(--over);font-style:normal}
.hint{font-size:13px;color:var(--mid)}
input,select,textarea{width:100%;min-height:44px;border:1.5px solid #AEB5BD;border-radius:8px;padding:8px 10px;background:#fff;font-size:16px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--steel);outline:none;box-shadow:0 0 0 3px var(--yel)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--over)}
.chkf{justify-content:flex-end}
.chk{display:flex!important;align-items:center;gap:10px;min-height:44px;font-size:16px!important;text-transform:none!important;letter-spacing:0!important;color:var(--steel)!important;font-weight:600!important;cursor:pointer}
.chk input{width:24px;height:24px;min-height:0;accent-color:var(--steel)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;min-width:46px;padding:0 12px;border:1.5px solid #AEB5BD;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);color:#fff;border-color:var(--steel)}
.ckseg button[data-sv="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.ckseg button[data-sv="fix"][aria-pressed="true"]{background:var(--over);border-color:var(--over)}
.ckg{display:flex;flex-direction:column;gap:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ckg h3{background:var(--yel);color:var(--steel);padding:6px 12px}
.ck{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ck>span{flex:1;min-width:150px;font-weight:600}
.hcol{background:#fff;border:1.5px solid var(--steel);border-radius:10px;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.hct{background:var(--steel);color:var(--yel);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 -12px;padding:8px 12px}
.sgrp{display:flex;flex-direction:column;gap:10px}
/* damage diagram */
.dtools{display:flex;flex-direction:column;gap:8px}
.legend{font-size:14px;color:var(--steel-2)}
.legend .r{color:var(--over)}
.diag{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--steel-2);align-items:center}
.dv{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dv.side{grid-column:1/-1}
.dv em{font-style:normal;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mid)}
.dz{position:relative;width:100%;cursor:crosshair;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dz>div{height:100%}
.dz svg{display:block;width:100%;height:auto}
.dv.side .dz{max-width:420px}
.dv.top .dz{height:250px;width:auto;aspect-ratio:140/300}
.dv.top svg{height:100%;width:100%}
.fr2{display:flex;flex-direction:column;gap:10px;align-items:center}
.fr2 .dz{max-width:200px}
.flip{transform:scaleX(-1)}
.mk{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--steel);color:#fff;font:800 13px/22px var(--body);text-align:center;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--steel);padding:0;cursor:pointer}
.mk.in{background:var(--over);box-shadow:0 0 0 1.5px var(--over)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sigbox{display:flex;flex-direction:column;gap:4px}
.sigbox .sl{display:flex;justify-content:space-between;align-items:center}
.sigbox .sl span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid)}
.sigbox .sl button{background:none;border:0;color:var(--steel);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px;min-height:32px}
.sigbox canvas{width:100%;aspect-ratio:10/3;background:#fff;border:1.5px dashed #AEB5BD;border-radius:8px;touch-action:none;display:block;cursor:crosshair}
.decl{font-size:13px;color:var(--mid);line-height:1.45}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--steel);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;z-index:70;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.toast.show{display:block}
.toast.err{background:var(--over)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{position:relative}
.btn:focus-within{outline:3px solid #1A73E8;outline-offset:2px}
.phg{display:flex;flex-direction:column;gap:8px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.phw{position:relative}
.ph{display:block;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--tint);padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.busy,.ph.broken{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mid);text-align:center;padding:6px}
.ph.busy{cursor:progress;background:repeating-linear-gradient(-45deg,var(--tint) 0 8px,#F6F7F8 8px 16px)}
.ph.broken img{display:none}
.ph.broken::after{content:"Photo not available"}
.ph-x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:var(--steel);color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:0}
.phnone{font-size:14px}
.lb{position:fixed;inset:0;z-index:80;background:#0F1113;display:flex;flex-direction:column;color:#fff}
.lb-top,.lb-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex:none}
.lb-top span{font-weight:700;font-size:15px}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain}
.lb button{background:none;border:1.5px solid #6E7782;color:#fff;border-radius:6px;min-height:42px;min-width:42px;padding:0 14px;font-weight:700;cursor:pointer}
.lb button[disabled]{opacity:.35;cursor:default}
.bkc.stale{border-left:6px solid var(--soon)}
.inst{border-top:6px solid var(--yel)}
.inst p{margin-bottom:10px}
@media (max-width:420px){h1{font-size:28px}.tile b{font-size:28px}.cv-name{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

  const v = byId('vehicles', vid); if (v) t(v.odoBought);

const REN = [['insExp','Insurance','expired','expires'],['licExp','Vehicle licence','expired','expires'],['testDue','Vehicle test','overdue','due'],['permitExp','Hire licence / permit','expired','expires'],['nextSvcDate','Service','overdue','due']];
function alertsFor(v) {

  for (const [k, label, past, fut] of REN) {
    const d = daysUntil(v[k]); if (d == null) continue;
    if (d < 0) out.push({lvl:'over', sort:d, text:`${label} ${past} ${plural(-d, 'day')} ago`, when:fmtDate(v[k])});

}

const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const done = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Saving was cancelled.')); });
function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('No storage')); return; }
    let r; try { r = indexedDB.open('fleet-logbook', 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => { const d = r.result; ['docs', 'photos', 'meta'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('Storage is busy'));
  });
}
async function idbPut(name, key, val) { const t = IDB.transaction(name, 'readwrite'); t.objectStore(name).put(val, key); await done(t); }
async function idbDel(name, key) { const t = IDB.transaction(name, 'readwrite'); t.objectStore(name).delete(key); await done(t); }
const idbGet = (name, key) => reqP(IDB.transaction(name).objectStore(name).get(key));
async function idbAll(name) { const st = IDB.transaction(name).objectStore(name); const [k, v] = await Promise.all([reqP(st.getAllKeys()), reqP(st.getAll())]); return k.map((x, i) => [x, v[i]]); }
function saveErr(e) {

}
let persistAsked = false;
function askPersist() { if (persistAsked) return; persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ } }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function memPut(col, id, data) {
  if (col === 'company') { S.company = Object.assign({}, data); scheduleRender(); return; }
  const rec = Object.assign({}, data, {id});
  const i = S[col].findIndex(r => r.id === id);
  if (i >= 0) S[col][i] = rec; else S[col].push(rec);

}
async function putDoc(col, id, data) {

  memPut(col, id, val);
}
async function mergeDoc(col, id, data) {

}
async function delDoc(col, id) {

}
async function setMeta(k, v) { META[k] = v; if (IDB) { try { await idbPut('meta', k, v); } catch (e) { /* reminder only */ } } }
async function loadAll() {
  COLS.forEach(c => { S[c] = []; }); S.company = {};
  (await idbAll('docs')).forEach(([k, v]) => {

  const v = byId('vehicles', vid); const p = v && splitISO(v.dateIn); if (p) for (let k = p[0]; k <= y; k++) set.add(k);
  return [...set].sort((a, b) => b - a);
}
function monthlySection(vid, year) {
  const doc = byId('monthly', vid + '_' + year); const m = (doc && doc.m) || {};

  const rows = MONTHS.map((name, i) => {

}

      break;
    }
    case 'bk-share': shareBackup(); break;
    case 'bk-cancel': RS = null; render(); break;
    case 'bk-restore': {
      if (!RS) break;
      if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Tap again to replace everything'; setTimeout(() => { t.classList.remove('armed'); t.textContent = 'Replace everything with this backup'; }, 4000); break; }
      t.disabled = true; t.textContent = 'Restoring…';
      restoreBackup(RS.data).then(() => { toast('Backup restored'); go('home', {}, true); }).catch(e => { toast(e.message, true); render(); });
      break;
    }
    case 'install': if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); Promise.resolve(ev.userChoice).finally(render); } break;
    case 'install-hide': setMeta('installHide', true).then(render); break;
    case 'close-sheet': closeSheet(); break;
    case 'sheet-save': doSave(); break;
    case 'sheet-del': doDelete(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'filter') { top().vid = t.value; render(); }
  else if (t.dataset.change === 'year') { top().year = +t.value; render(); }
  else if (t.dataset.restore) {
    const f = t.files && t.files[0]; t.value = '';
    if (f) readBackup(f).then(d => { RS = {data: d, exported: d.exported, company: d.company, cars: d.docs.filter(x => x && x.col === 'vehicles').length, entries: d.docs.filter(x => x && x.col !== 'vehicles' && x.col !== 'company').length, photos: Object.keys(d.photos || {}).length}; render(); }).catch(e => toast(e.message, true));
  }
  else if (t.dataset.up && sheet.pm) { const files = [...(t.files || [])]; t.value = ''; if (files.length) addPhotos(sheet.pm, files, t.dataset.up); }
  else if (sheet.ho && t.dataset.k === 'vid' && t.closest('#shBody')) sheet.ho.vehicleChanged(t, $('#shBody'));
});
document.addEventListener('error', e => { const el = e.target; if (el && el.tagName === 'IMG' && el.closest('.ph')) el.closest('.ph').classList.add('broken'); }, true);
document.addEventListener('input', e => { if (e.target.dataset.mf) monthlyTotals($('#shBody')); });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') { if (!$('#lb').hidden) lbClose(); else if ($('#sheet').classList.contains('open')) closeSheet(); }
});

/* ---------------- start ---------------- */
const h0 = location.hash.slice(1);
if (TOPS.includes(h0) && h0 !== 'home') nav.stack = [{v:'home'}, {v:h0}];
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; scheduleRender(); });
window.addEventListener('appinstalled', () => { installEvt = null; scheduleRender(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
boot();
})();
</script>
